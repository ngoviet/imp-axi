# Cấu hình no-mistakes cho repo imp-axi.
#
# ⚠️ Các field ĐIỀU KHIỂN (commands, agent, no_ci, gates…) chỉ được đọc từ
# **default branch** — cố ý, để nhánh do người khác đẩy lên không tự khai báo hay
# tự chạy lệnh trên máy chủ daemon. Nên file này phải nằm trên `main`.

# Chưa có CI trên GitHub (repo riêng tư, chưa thêm workflow). Kiểm chứng thật là
# lệnh test bên dưới + bước Test của pipeline. Không khai báo thì bước CI chờ
# "0 check" tới `ci_timeout` (168h). Khai báo này KHÔNG miễn trừ check thật nếu sau
# này có workflow (tạo bằng `no-mistakes ci-workflow`).
no_ci: true

# Lệnh nền chạy TRƯỚC agent test (exit ≠ 0 ⇒ dừng bước Test): cài phụ thuộc sạch
# (allowScripts trong package.json cho esbuild chạy postinstall) rồi typecheck +
# eslint + vitest (test dùng engine giả, không chạy binary Impeccable; build dist/ trong global-setup).
commands:
  test: "npm ci --no-audit --no-fund && npm run check"
